{% extends "base.html" %}
{% block title %}Checkout{% endblock %}
{% block content %}
<h1>Checkout</h1>
<div class="two-col">
  <form method="post" class="form">
    <label>Full name <input type="text" name="name" value="{{ request.form.get('name', '') }}"></label>
    <label>Email <input type="email" name="email" value="{{ request.form.get('email', '') }}"></label>
    <label>Delivery address <textarea name="address" rows="3">{{ request.form.get('address', '') }}</textarea></label>
    <button type="submit">Place order</button>
  </form>
  <div class="summary">
    <h2>Order summary</h2>
    {% for it in items %}
      <p>{{ it.product.name }} x {{ it.qty }} <span class="right">₹{{ "{:,.0f}".format(it.subtotal) }}</span></p>
    {% endfor %}
    <p class="total">Total: ₹{{ "{:,.0f}".format(total) }}</p>
  </div>
</div>
{% endblock %}
