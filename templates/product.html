{% extends "base.html" %}
{% block title %}{{ p.name }}{% endblock %}
{% block content %}
<div class="detail">
  <div class="emoji big">{{ p.emoji }}</div>
  <div>
    <h1>{{ p.name }}</h1>
    <p class="muted">{{ p.category }}</p>
    <p>{{ p.description }}</p>
    <p class="price">₹{{ "{:,.0f}".format(p.price) }}</p>
    <form action="{{ url_for('add_to_cart', pid=p.id) }}" method="post">
      <button type="submit">Add to cart</button>
    </form>
    <p><a href="{{ url_for('index') }}">Back to products</a></p>
  </div>
</div>
{% endblock %}
