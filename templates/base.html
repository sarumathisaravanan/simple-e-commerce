<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Jai shop{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="nav">
    <a class="brand" href="{{ url_for('index') }}">Jai Shop</a>
    <form class="search" action="{{ url_for('index') }}" method="get">
      <input type="text" name="q" placeholder="Search products" value="{{ request.args.get('q', '') }}">
      <button type="submit">Search</button>
    </form>
    <nav>
      <a href="{{ url_for('orders') }}">Orders</a>
      <a href="{{ url_for('cart') }}">Cart ({{ cart_count }})</a>
    </nav>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
